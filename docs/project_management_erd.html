
<style>
#erd { padding: 0.5rem 0; }
#erd svg { overflow: visible; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2C2C2A' : '#F1EFE8',
    primaryBorderColor: dark ? '#5F5E5A' : '#B4B2A9',
  },
});
const diagram = `erDiagram
  users {
    bigint id PK
    string name
    string email UK
    string password_digest
    int role "enum: admin member"
    text specialties
    timestamp created_at
    timestamp updated_at
  }
  teams {
    bigint id PK
    string name
    text description
    timestamp created_at
    timestamp updated_at
  }
  team_memberships {
    bigint id PK
    bigint user_id FK
    bigint team_id FK
    int role "enum: admin member"
    timestamp created_at
    timestamp updated_at
  }
  projects {
    bigint id PK
    bigint team_id FK
    string name
    text goal
    date deadline
    int priority "enum: low medium high critical"
    int status "enum: planning active on_hold done"
    timestamp created_at
    timestamp updated_at
  }
  project_memberships {
    bigint id PK
    bigint project_id FK
    bigint user_id FK
    timestamp created_at
    timestamp updated_at
  }
  tasks {
    bigint id PK
    bigint project_id FK
    string title
    string subtitle
    date deadline
    int priority "enum: low medium high critical"
    int status "enum: todo in_progress review done"
    timestamp created_at
    timestamp updated_at
  }
  task_assignments {
    bigint id PK
    bigint task_id FK
    bigint user_id FK
    timestamp created_at
    timestamp updated_at
  }

  users ||--o{ team_memberships : "belongs to teams via"
  teams ||--o{ team_memberships : "has members via"
  teams ||--o{ projects : "owns"
  projects ||--o{ project_memberships : "has responsibles via"
  users ||--o{ project_memberships : "participates in projects via"
  projects ||--o{ tasks : "has many"
  tasks ||--o{ task_assignments : "assigned to users via"
  users ||--o{ task_assignments : "is assigned tasks via"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
